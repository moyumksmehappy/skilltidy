<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillTidy · 技能看板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SkillTidy</span>
    <span class="brand-sub">技能看板</span>
  </div>
  <div class="search-wrap">
    <input id="q" type="search" placeholder="搜索名称、描述、项目、标签…  按 / 聚焦" autocomplete="off">
  </div>
  <div class="top-actions">
    <label class="switch" title="每 5 分钟自动重新扫描">
      <input type="checkbox" id="autoRefresh">
      <span>自动刷新</span>
    </label>
    <button id="btnScan" class="btn primary">重新扫描</button>
    <button id="btnSettings" class="btn ghost" title="扫描位置与阈值">设置</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <section class="side-block">
      <div class="stat-grid">
        <div class="stat" title="扫描到的全部技能，不含已归档">
          <b id="statTotal">–</b><span>技能</span>
        </div>
        <div class="stat warn" id="statAttentionCell" title="每个技能只归类一次：重复 → 项目领先 → 沉睡 → 该复查">
          <b id="statAttention">–</b><span>待处理</span>
        </div>
        <div class="stat" id="statDupCell" title="同名技能算一组">
          <b id="statDup">–</b><span>重复组</span>
        </div>
        <div class="stat" title="你标记了收藏的技能">
          <b id="statStar">–</b><span>收藏</span>
        </div>
      </div>
    </section>

    <section class="side-block">
      <h3>视图</h3>
      <ul class="nav" id="nav"></ul>
    </section>

    <section class="side-block">
      <h3>设备 / 位置 <span class="hint" id="devClear">清除</span></h3>
      <ul class="nav small" id="devList"></ul>
    </section>

    <section class="side-block">
      <h3>项目</h3>
      <ul class="nav small scroll" id="projList"></ul>
    </section>

    <section class="side-block foot">
      <div class="scan-meta" id="scanMeta">尚未扫描</div>
    </section>
  </aside>

  <main class="main">
    <div class="list-head">
      <div class="list-title"><b id="viewTitle">全部技能</b> <span id="viewCount"></span></div>
      <div class="list-tools">
        <select id="sort">
          <option value="attention">按需关注度</option>
          <option value="mtime">按更新时间</option>
          <option value="name">按名称</option>
          <option value="project">按项目</option>
          <option value="age">按龄期</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table class="grid">
        <thead>
          <tr>
            <th class="c-dot"></th>
            <th class="c-name">技能</th>
            <th class="c-loc">位置</th>
            <th class="c-time">更新</th>
            <th class="c-badge">标记</th>
            <th class="c-star"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </main>
</div>

<div class="drawer-backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div>
      <h2 id="dName">–</h2>
      <div class="drawer-path" id="dPath"></div>
    </div>
    <button class="icon-btn" id="dClose" title="关闭">×</button>
  </div>

  <div class="drawer-meta" id="dMeta"></div>

  <div class="drawer-actions">
    <button class="btn primary sm" id="dReview">标记已审查</button>
    <button class="btn sm" id="dStar">收藏</button>
    <button class="btn sm" id="dOpen">打开文件夹</button>
    <button class="btn sm" id="dEdit">编辑</button>
    <button class="btn sm danger" id="dArchive">归档</button>
  </div>

  <div class="drawer-body">
    <div class="tabs">
      <button class="tab active" data-tab="preview">预览</button>
      <button class="tab" data-tab="files">文件</button>
      <button class="tab" data-tab="notes">笔记</button>
    </div>

    <div class="tab-panel" id="tab-preview">
      <div class="md" id="dContent">加载中…</div>
      <div class="editor" id="dEditor" hidden>
        <textarea id="dText" spellcheck="false"></textarea>
        <div class="editor-bar">
          <button class="btn primary sm" id="dSave">保存</button>
          <button class="btn sm" id="dCancel">取消</button>
          <span class="editor-hint" id="dSaveHint"></span>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-files" hidden>
      <ul class="file-list" id="dFiles"></ul>
    </div>

    <div class="tab-panel" id="tab-notes" hidden>
      <label class="field">
        <span>标签（逗号分隔）</span>
        <input id="dTags" placeholder="后端, 已上线">
      </label>
      <label class="field">
        <span>备注 / 下次要改什么</span>
        <textarea id="dNote" rows="5" placeholder="例：等 k8s 权限模型定了再补一段"></textarea>
      </label>
      <button class="btn primary sm" id="dSaveMeta">保存标签与备注</button>
    </div>
  </div>
</aside>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-box">
    <h2>扫描设置</h2>
    <p class="modal-desc">勾选要扫描的位置。跨设备时把整个 skilltidy 目录放进同步盘或 git，笔记与标签会跟着走。</p>
    <div id="rootsList" class="roots"></div>
    <div class="modal-row">
      <label>沉睡阈值（天）<input type="number" id="staleDays" min="7" max="730"></label>
      <label>复查周期（天）<input type="number" id="reviewDays" min="7" max="365"></label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btnExport">导出笔记</button>
      <button class="btn" id="btnImport">导入笔记</button>
      <input type="file" id="fileImport" accept=".json" hidden>
      <button class="btn primary" id="btnSaveSettings">保存</button>
      <button class="btn ghost" id="btnCloseSettings">关闭</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
